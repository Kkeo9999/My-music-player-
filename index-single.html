<script>

// My Money Reset — Personal Finance Dashboard (MVP)
// Data stored in LocalStorage only

const STORAGE_KEY = 'myMoneyReset_v1';

const DEFAULT_SETTINGS = {
  primaryCurrency: 'LAK',
  incomeMonthly: 29000,
  payday: 28,
  rentLAK: 2000000,
  foodDailyLAK: 120000,
  transportDailyLAK: 20000,
  savingsGoalMonthlyTHB: 15000,
  exchangeRates: [{ from: 'THB', to: 'LAK', rate: 650, date: new Date().toISOString().slice(0,10) }],
  alertLevels: [70, 90, 100]
};

const DEFAULT_ACCOUNTS = [
  { id: 'acc_cash_lak', name: 'เงินสด (กีบ)', currency: 'LAK', balance: 678000, type: 'cash' },
  { id: 'acc_bank_thb', name: 'บัญชีธนาคาร (บาท)', currency: 'THB', balance: 0, type: 'bank' },
  { id: 'acc_emergency', name: 'เงินสำรองฉุกเฉิน', currency: 'LAK', balance: 0, type: 'emergency' }
];

const EXPENSE_CATEGORIES = [
  { id: 'food', name: 'อาหารและเครื่องดื่ม', icon: '🍜' },
  { id: 'rent', name: 'ค่าเช่าที่พัก', icon: '🏠' },
  { id: 'transport', name: 'การเดินทาง', icon: '🚌' },
  { id: 'phone', name: 'โทรศัพท์และอินเทอร์เน็ต', icon: '📱' },
  { id: 'personal', name: 'ของใช้ส่วนตัว', icon: '🧴' },
  { id: 'health', name: 'สุขภาพ', icon: '💊' },
  { id: 'family', name: 'ครอบครัว', icon: '👨‍👩‍👧' },
  { id: 'education', name: 'การศึกษาและพัฒนาทักษะ', icon: '📚' },
  { id: 'entertainment', name: 'ความบันเทิง', icon: '🎬' },
  { id: 'fees', name: 'ค่าธรรมเนียมทางการเงิน', icon: '🏦' },
  { id: 'other', name: 'อื่น ๆ', icon: '📦' }
];

const INCOME_CATEGORIES = [
  { id: 'salary', name: 'เงินเดือน', icon: '💼' },
  { id: 'family_support', name: 'เงินช่วยเหลือจากครอบครัว', icon: '💝' },
  { id: 'side', name: 'รายได้เสริม', icon: '🛠️' },
  { id: 'refund', name: 'เงินคืน', icon: '↩️' },
  { id: 'other_income', name: 'อื่น ๆ', icon: '💰' }
];

let state = {
  settings: { ...DEFAULT_SETTINGS },
  accounts: JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS)),
  transactions: [],
  budgets: {},
  goals: [],
  emergencyFund: { history: [] },
  commitment: { startDate: null, daysLogged: [], notes: [] },
  pendingPurchases: [],
  isSample: false
};

let currentPage = 'dashboard';

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function formatNumber(n) { return Number(n || 0).toLocaleString('th-TH'); }
function formatCurrency(amount, currency) {
  return (currency === 'THB' ? '฿' : '₭') + formatNumber(amount);
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function daysBetween(d1, d2) {
  return Math.round((new Date(d2) - new Date(d1)) / 86400000);
}
function getRate(from, to) {
  if (from === to) return 1;
  const r = (state.settings.exchangeRates || []).find(x => x.from === from && x.to === to);
  if (r) return r.rate;
  const rev = (state.settings.exchangeRates || []).find(x => x.from === to && x.to === from);
  return rev ? 1 / rev.rate : null;
}
function getCurrentBudgetPeriod() {
  const now = new Date();
  const day = now.getDate();
  const payday = state.settings.payday || 28;
  let start, end;
  if (day >= payday) {
    start = new Date(now.getFullYear(), now.getMonth(), payday);
    end = new Date(now.getFullYear(), now.getMonth() + 1, payday - 1);
  } else {
    start = new Date(now.getFullYear(), now.getMonth() - 1, payday);
    end = new Date(now.getFullYear(), now.getMonth(), payday - 1);
  }
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state = { ...state, ...p };
      if (!state.accounts?.length) state.accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
      if (!state.settings) state.settings = { ...DEFAULT_SETTINGS };
    }
  } catch (e) { console.error(e); }
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hide');
  setTimeout(() => el.classList.add('hide'), 2500);
}
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-root').classList.remove('hide');
}
function closeModal() { document.getElementById('modal-root').classList.add('hide'); }

function getBalancesByCurrency() {
  const r = { THB: 0, LAK: 0 };
  state.accounts.forEach(a => { r[a.currency] = (r[a.currency] || 0) + a.balance; });
  return r;
}
function getTransactionsInPeriod(start, end, type) {
  return state.transactions.filter(t => {
    if (t.date < start || t.date > end) return false;
    if (type && t.type !== type) return false;
    if (t.type === 'transfer') return false;
    return true;
  });
}
function getMonthlyByType(start, end, type) {
  const byCur = { THB: 0, LAK: 0 };
  getTransactionsInPeriod(start, end, type).forEach(t => { byCur[t.currency] = (byCur[t.currency] || 0) + t.amount; });
  return byCur;
}
function getCategorySpentByCurrency(catId, start, end) {
  const r = { THB: 0, LAK: 0 };
  state.transactions.filter(t => t.type === 'expense' && t.category === catId && t.date >= start && t.date <= end)
    .forEach(t => { r[t.currency] = (r[t.currency] || 0) + t.amount; });
  return r;
}
function calcStreak() {
  const dates = [...new Set(state.transactions.map(t => t.date))].sort().reverse();
  if (!dates.length) return 0;
  let streak = 0, expected = todayStr();
  for (const d of dates) {
    if (d === expected) {
      streak++;
      const p = new Date(expected); p.setDate(p.getDate() - 1);
      expected = p.toISOString().slice(0,10);
    } else break;
  }
  return streak;
}

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  render();
  window.scrollTo(0, 0);
}

function render() {
  const app = document.getElementById('app');
  const pages = {
    dashboard: renderDashboard,
    transactions: renderTransactions,
    add: () => renderAddForm(),
    budget: renderBudget,
    goals: renderGoals,
    insights: renderInsights,
    commitment: renderCommitment,
    reports: renderReports,
    settings: renderSettings
  };
  app.innerHTML = (pages[currentPage] || renderDashboard)();
  bindEvents();
}

function renderBudgetBar(label, spent, budget, currency) {
  const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
  let color = 'bg-primary-500';
  if (pct >= 100) color = 'bg-danger-500';
  else if (pct >= 90) color = 'bg-warn-500';
  else if (pct >= 70) color = 'bg-amber-400';
  return `<div>
    <div class="flex justify-between text-sm mb-1"><span class="font-medium">${label}</span>
    <span class="text-slate-500">${formatCurrency(spent, currency)} / ${formatCurrency(budget, currency)} (${pct.toFixed(0)}%)</span></div>
    <div class="progress-bar"><div class="progress-fill ${color}" style="width:${pct}%"></div></div>
  </div>`;
}

function generateInsights(period, foodSpent, balances) {
  const msgs = [];
  const foodBudget = state.settings.foodDailyLAK * 30;
  if (foodBudget > 0) msgs.push(`เดือนนี้คุณใช้ค่าอาหารไปแล้ว ${((foodSpent.LAK || 0) / foodBudget * 100).toFixed(0)}% ของงบ`);
  if (balances.LAK < state.settings.rentLAK) msgs.push('เงินสำรองยังไม่เพียงพอสำหรับค่าเช่ารอบถัดไป — ลองทบทวนรายจ่ายที่ไม่จำเป็น');
  msgs.push(`งบอาหาร+เดินทางต่อวันประมาณ ${formatCurrency(state.settings.foodDailyLAK + state.settings.transportDailyLAK, 'LAK')}`);
  const streak = calcStreak();
  if (streak > 0) msgs.push(`คุณบันทึกรายจ่ายต่อเนื่องครบ ${streak} วันแล้ว เก่งมาก!`);
  if (!msgs.length) msgs.push('ยังไม่มีข้อมูลเพียงพอสำหรับสรุป — ลองเพิ่มรายการดูนะ');
  return msgs;
}

function filterTx() {
  const q = (document.getElementById('tx-search')?.value || '').toLowerCase();
  const type = document.getElementById('tx-filter-type')?.value || '';
  const list = document.getElementById('tx-list');
  const sorted = [...state.transactions].sort((a,b) => b.date.localeCompare(a.date));
  const filtered = sorted.filter(t => {
    if (type && t.type !== type) return false;
    if (q) {
      const cat = (t.type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).find(c => c.id === t.category);
      if (!`${cat?.name||''} ${t.note||''} ${t.amount}`.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  list.innerHTML = filtered.length === 0 ? '<div class="text-center text-slate-400 py-8">ไม่พบรายการ</div>' : filtered.map(renderTxItem).join('');
}

function toggleCatSelect() {
  const type = document.querySelector('input[name="type"]:checked')?.value;
  const catSelect = document.getElementById('category-select');
  const transferTo = document.getElementById('transfer-to');
  if (type === 'transfer') {
    document.getElementById('cat-select').classList.add('hide');
    transferTo.classList.remove('hide');
  } else {
    document.getElementById('cat-select').classList.remove('hide');
    transferTo.classList.add('hide');
    const cats = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
    catSelect.innerHTML = cats.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  }
}

function applyTxToBalance(tx, reverse) {
  const mul = reverse ? -1 : 1;
  if (tx.type === 'income') {
    const acc = state.accounts.find(a => a.id === tx.accountId);
    if (acc) acc.balance += tx.amount * mul;
  } else if (tx.type === 'expense') {
    const acc = state.accounts.find(a => a.id === tx.accountId);
    if (acc) acc.balance -= tx.amount * mul;
  } else if (tx.type === 'transfer') {
    const from = state.accounts.find(a => a.id === tx.accountId);
    const to = state.accounts.find(a => a.id === tx.toAccountId);
    if (from) from.balance -= tx.amount * mul;
    if (to) {
      if (from && from.currency === to.currency) to.balance += tx.amount * mul;
      else {
        const rate = getRate(from?.currency, to.currency);
        to.balance += (rate ? tx.amount * rate : tx.amount) * mul;
      }
    }
  }
}

function submitTx(e, editId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const type = fd.get('type');
  const amount = parseFloat(fd.get('amount'));
  const currency = fd.get('currency');
  const category = fd.get('category') || 'other';
  const date = fd.get('date');
  const accountId = fd.get('accountId');
  const toAccountId = fd.get('toAccountId');
  const note = fd.get('note') || '';
  if (amount <= 0) { showToast('จำนวนเงินต้องมากกว่า 0'); return; }
  const acc = state.accounts.find(a => a.id === accountId);
  if (!acc) { showToast('ไม่พบบัญชี'); return; }
  if (editId) {
    const old = state.transactions.find(t => t.id === editId);
    if (old) applyTxToBalance(old, true);
    state.transactions = state.transactions.filter(t => t.id !== editId);
  }
  const tx = {
    id: editId || uid(), type, amount, currency,
    category: type === 'transfer' ? 'transfer' : category,
    date, accountId, accountName: acc.name,
    toAccountId: type === 'transfer' ? toAccountId : null,
    note, createdAt: Date.now()
  };
  applyTxToBalance(tx, false);
  state.transactions.push(tx);
  save();
  showToast(editId ? 'แก้ไขรายการแล้ว' : 'บันทึกรายการแล้ว');
  navigate(editId ? 'transactions' : 'dashboard');
}

function doAddEmergency() {
  const amount = parseFloat(document.getElementById('ef-amount').value)||0;

  const from = state.accounts.find(a => a.id === fromId);

function exportCSV() {
  const rows = [['id','type','amount','currency','category','date','account','note']];
  state.transactions.forEach(t => rows.push([t.id,t.type,t.amount,t.currency,t.category,t.date,t.accountName||'',t.note||'']));
  const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  downloadFile(csv, 'my-money-reset-transactions.csv', 'text/csv');
  showToast('ส่งออก CSV แล้ว');
}
function exportJSON() {
  downloadFile(JSON.stringify(state, null, 2), 'my-money-reset-backup.json', 'application/json');
  showToast('สำรองข้อมูลแล้ว');
}
function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.transactions || !data.accounts) throw new Error('invalid');
      state = { ...state, ...data }; save(); showToast('นำเข้าข้อมูลสำเร็จ'); render();
    } catch { showToast('ไฟล์ไม่ถูกต้อง — ข้อมูลเดิมยังปลอดภัย'); }
  };
  reader.readAsText(file); e.target.value = '';
}
function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

    { id: uid(), name: 'พัฒนาทักษะ / คอร์สเรียน', target: 15000, current: 3000, currency: 'THB', deadline: null, createdAt: Date.now() }
  ];
  state.commitment = { startDate: d(-12), daysLogged: [d(-12),d(-11),d(-10),d(-9),d(-8),d(-7),d(-6),d(-5),d(-4),d(-3),d(-2),d(-1),todayStr()], notes: [{ date: d(-3), text: 'รู้สึกอยากเทรดแต่เลือกไปเดินเล่นแทน (ตัวอย่าง)' }] };
  state.budgets = { food: {amount:3600000,currency:'LAK'}, transport: {amount:600000,currency:'LAK'}, rent: {amount:2000000,currency:'LAK'} };
  save(); showToast('โหลดข้อมูลตัวอย่างแล้ว'); navigate('dashboard');
}

function openPaydayPlanner() {
  const salary = state.settings.incomeMonthly;
  const rate = getRate('THB','LAK') || 650;
  openModal(`<div class="p-6 space-y-4"><h2 class="text-lg font-bold">แบ่งเงินเดือน (Payday Planner)</h2>
    <p class="text-sm text-slate-600">รายได้ประมาณ ${formatCurrency(salary,'THB')} — จัดสรรตามลำดับความสำคัญ (ไม่หักเงินจริงจนกว่าจะยืนยัน)</p>
    <div class="space-y-3 text-sm">
      <div class="flex justify-between items-center"><span>1. ค่าเช่าเดือนถัดไป</span><input type="number" id="pp-rent" class="input w-28 text-right" value="${Math.round(state.settings.rentLAK/rate)}" /></div>
      <div class="flex justify-between items-center"><span>2. อาหาร + เดินทาง</span><input type="number" id="pp-daily" class="input w-28 text-right" value="${Math.round((state.settings.foodDailyLAK+state.settings.transportDailyLAK)*30/rate)}" /></div>
      <div class="flex justify-between items-center"><span>3. บิลจำเป็นอื่น</span><input type="number" id="pp-bills" class="input w-28 text-right" value="0" /></div>
      <div class="flex justify-between items-center"><span>4. เงินสำรองฉุกเฉิน</span><input type="number" id="pp-ef" class="input w-28 text-right" value="1000" /></div>
      <div class="flex justify-between items-center"><span>5. ออมตามเป้าหมาย</span><input type="number" id="pp-save" class="input w-28 text-right" value="${state.settings.savingsGoalMonthlyTHB}" /></div>
      <div class="flex justify-between items-center"><span>6. ใช้จ่ายส่วนตัว</span><input type="number" id="pp-personal" class="input w-28 text-right" value="2000" /></div>
    </div>
    <div id="pp-total" class="text-sm font-medium text-center py-2"></div>
    <div class="flex gap-2"><button onclick="confirmPayday()" class="btn btn-primary flex-1">ยืนยันแผน (ยังไม่หักเงิน)</button>
    <button onclick="closeModal()" class="btn btn-secondary flex-1">ปิด</button></div></div>`);
  setTimeout(() => {
    const inputs = ['pp-rent','pp-daily','pp-bills','pp-ef','pp-save','pp-personal'];
    const update = () => {
      let sum = 0; inputs.forEach(id => sum += parseFloat(document.getElementById(id)?.value)||0);
      const el = document.getElementById('pp-total');
      if (el) { const remain = salary - sum; el.innerHTML = remain >= 0 ? `จัดสรรทั้งหมด ${formatCurrency(sum,'THB')} · เหลือ ${formatCurrency(remain,'THB')}` : `<span class="text-danger-600">จัดสรรเกินรายรับ ${formatCurrency(Math.abs(remain),'THB')}</span>`; }
    };
    inputs.forEach(id => document.getElementById(id)?.addEventListener('input', update)); update();
  }, 50);
}
function confirmPayday() { showToast('บันทึกแผนแบ่งเงินแล้ว (ยังไม่มีการหักเงินจริง)'); closeModal(); }

function bindEvents() {
  document.querySelectorAll('[data-page]').forEach(btn => { btn.onclick = () => navigate(btn.dataset.page); });
}

load();
navigate('dashboard');
</script></body></html>
